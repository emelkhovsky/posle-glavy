function episodeCountLabel(n){const lastTwo=n%100,last=n%10;const word=lastTwo>=11&&lastTwo<=14?'серий':last===1?'серия':[2,3,4].includes(last)?'серии':'серий';return `${n} ${word}`}
function matches(s){return activeTags.every(tag=>s.tags.some(t=>t.toLowerCase()===tag.toLowerCase()))&&(!query||[s.title,s.ruTitle,s.author,...s.tags].join(' ').toLowerCase().includes(query.toLowerCase()))}
function syncTagControls(){document.querySelectorAll('.chosen-count').forEach(el=>el.textContent=activeTags.length?`Выбрано тегов: ${activeTags.length}`:'Можно выбрать несколько тегов');document.querySelectorAll('[data-select-tag]').forEach(b=>{const active=activeTags.includes(b.dataset.selectTag);b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('[data-extra-tag]').forEach(b=>{const active=activeTags.includes(b.dataset.extraTag);b.classList.toggle('active',active);b.querySelector('.check').textContent=active?'✓':''});document.querySelectorAll('[data-clear-tags]').forEach(b=>b.classList.toggle('active',activeTags.length===0));document.querySelectorAll('.more-button').forEach(el=>{const count=activeTags.length||Number(el.dataset.extraCount||0);el.innerHTML=`${activeTags.length?'Выбрано':'Ещё'} <b class="more-count">${count}</b>`})}
function toggleTag(tag){activeTags=activeTags.includes(tag)?activeTags.filter(t=>t!==tag):[...activeTags,tag];syncTagControls();render()}
function tagsHTML(id){const root=document.querySelector(id),allQuick=id==='#feed-tags'?feedQuickTags:quickTags,mobile=window.matchMedia('(max-width:900px)').matches,quick=mobile?allQuick.slice(0,id==='#feed-tags'?2:3):allQuick,extra=filters.filter(t=>!quick.includes(t));root.innerHTML=`<button class="chip ${activeTags.length?'':'active'}" data-clear-tags>Все</button>${quick.map(t=>`<button class="chip" data-select-tag="${t}" aria-pressed="false">${t==='Хогвартс'?'<span class="desktop-tag">Хогвартс</span><span class="mobile-tag">Хог</span>':t==='Пост-Хогвартс'?'<span class="desktop-tag">Пост-Хогвартс</span><span class="mobile-tag">Пост-Хог</span>':t}</button>`).join('')}<div class="more-wrap"><button class="more-button" type="button" data-extra-count="${extra.length}" aria-expanded="false">Ещё <b class="more-count">${extra.length}</b></button><div class="tag-popover" hidden><div class="popover-head"><strong>Все теги</strong><button class="popover-reset" type="button">Сбросить</button></div><input class="tag-search" type="text" placeholder="Найти тег…"><div class="tag-list">${extra.map(t=>`<button type="button" class="tag-option" data-extra-tag="${t}"><span class="check"></span>${t}</button>`).join('')}</div><p class="chosen-count"></p></div></div>`;root.querySelector('[data-clear-tags]').onclick=()=>{activeTags=[];syncTagControls();render()};root.querySelectorAll('[data-select-tag]').forEach(b=>b.onclick=()=>toggleTag(b.dataset.selectTag));root.querySelectorAll('[data-extra-tag]').forEach(b=>b.onclick=()=>toggleTag(b.dataset.extraTag));root.querySelector('.more-button').onclick=e=>{const panel=e.currentTarget.nextElementSibling;panel.hidden=!panel.hidden;e.currentTarget.setAttribute('aria-expanded',String(!panel.hidden))};root.querySelector('.popover-reset').onclick=()=>{activeTags=[];syncTagControls();render()};root.querySelector('.tag-search').oninput=e=>{const q=e.target.value.toLowerCase();root.querySelectorAll('[data-extra-tag]').forEach(b=>b.hidden=!b.dataset.extraTag.toLowerCase().includes(q))};}
function render(){const rows=shows.filter(matches);feed.innerHTML=rows.length?rows.map(s=>{const index=shows.indexOf(s);return `<article class="clip"><div class="video"><div class="scene ${s.scene} art-${s.artIndex} reel-art-${s.artIndex}"><div class="arch"></div><div class="silhouette"></div><div class="silhouette s2"></div></div><div class="vignette"></div><div class="video-top"><span class="label">${s.episode}</span></div><div class="caption"><div class="creator"><button class="author-link" data-open-author="${s.author}">@${s.author}</button></div><h2>${s.title}</h2><p>${s.desc}</p><div class="clip-tags">${s.tags.slice(0,3).map(t=>`<span>${t}</span>`).join('')}${s.tags.length>3?`<div class="clip-tag-more-wrap"><button class="clip-tag-more" type="button" aria-expanded="false" aria-label="Показать ещё ${s.tags.length-3} тегов">${s.tags.length-3}+</button><div class="clip-tag-popover" hidden>${s.tags.slice(3).map(t=>`<span>${t}</span>`).join('')}</div></div>`:''}</div><button class="watch" data-open-series="${index}">${hasAccess(index)?'Смотреть сериал':'Смотреть полностью'}</button></div><div class="clip-actions"><button class="action save" type="button" aria-label="Сохранить на потом" aria-pressed="false" title="Сохранить на потом"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6.5 4.75h11a1 1 0 0 1 1 1v14l-6.5-4.1-6.5 4.1v-14a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><small>Сохранить</small></button><button class="action share" type="button" aria-label="Поделиться"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3.5 20 8l-6.5 4.5V9.8c-3.7 0-6.5.9-8 4.2 0-5.5 2.8-8.2 8-8.2V3.5Z"/></svg><small>Поделиться</small></button></div></div></article>`}).join(''):'<div class="empty">Ничего не найдено. Попробуй другой запрос или тег.</div>';
const cardMarkup=s=>{const index=shows.indexOf(s);return `<article class="series-card"><button class="cover ${s.scene} art-${s.artIndex}" data-open-series="${index}" aria-label="Открыть сериал ${s.title}"></button><div class="series-info"><div class="by">Автор: <button class="author-link" data-open-author="${s.author}">${s.author}</button></div><button class="series-title" data-open-series="${index}">${s.title}</button><p>${s.desc}</p><div class="tags">${s.tags.map(t=>`<span>${t}</span>`).join('')}</div><div class="series-foot"><button class="btn-trailer" data-open-trailer="${index}">Трейлер</button><button class="btn-series" data-open-series="${index}">Смотреть сериал</button></div></div></article>`};grid.innerHTML=rows.map(cardMarkup).join('');
document.querySelectorAll('[data-open-series]').forEach(b=>b.onclick=()=>openSeries(Number(b.dataset.openSeries)));document.querySelectorAll('[data-open-author]').forEach(b=>b.onclick=()=>openAuthor(b.dataset.openAuthor));document.querySelectorAll('[data-open-trailer]').forEach(b=>b.onclick=()=>openTrailer(Number(b.dataset.openTrailer)));

function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}
function setPane(id){document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===(id==='feed-pane'?'feed':'series')));window.scrollTo({top:0,behavior:'smooth'})}
let currentSeriesIndex=0;let demoAccessEnabled=localStorage.getItem('dramione-purchased-access')==='yes';
function hasAccess(index){return demoAccessEnabled}
function episodeProgress(index){const progress=JSON.parse(localStorage.getItem('dramione-episode-progress')||'{}');return Number(progress[index]||0)}
function hasStartedWatching(index){const started=JSON.parse(localStorage.getItem('dramione-started-series')||'{}');return Boolean(started[index])}
function markStartedWatching(index){const started=JSON.parse(localStorage.getItem('dramione-started-series')||'{}');started[index]=true;localStorage.setItem('dramione-started-series',JSON.stringify(started))}
function saveEpisodeProgress(index,number){const progress=JSON.parse(localStorage.getItem('dramione-episode-progress')||'{}');progress[index]=number;localStorage.setItem('dramione-episode-progress',JSON.stringify(progress))}
function saveAccess(index){demoAccessEnabled=true;localStorage.setItem('dramione-purchased-access','yes');updateDemoAccessSwitch()}
function updateDemoAccessSwitch(){const button=document.querySelector('#demo-access-switch');button.setAttribute('aria-checked',String(demoAccessEnabled));document.querySelector('#demo-access-label').textContent=demoAccessEnabled?'Есть':'Нет'}
function openPayment(index){currentSeriesIndex=index;const s=shows[index];document.querySelector('#payment-title').textContent=s.title;document.querySelector('#payment-copy').textContent=`Демо-цена доступа — ${s.price} ₽. Покупка отметит доступ к этому сериалу в прототипе.`;document.querySelector('#payment-modal').hidden=false}
function closePayment(){document.querySelector('#payment-modal').hidden=true}
function openSeries(index){const s=shows[index];if(!s)return;currentSeriesIndex=index;const unlocked=hasAccess(index);document.querySelector('#detail-cover').className=`detail-cover ${s.scene} art-${s.artIndex}`;document.querySelector('#detail-by').innerHTML=`<button class="author-link" data-open-author="${s.author}">${s.author}</button>`;document.querySelector('#detail-by [data-open-author]').onclick=()=>openAuthor(s.author);document.querySelector('#detail-title').textContent=s.title;document.querySelector('#detail-title-ru').textContent=s.ruTitle||'';document.querySelector('#detail-count').textContent=episodeCountLabel(s.episodeCount);document.querySelector('#detail-desc').textContent=s.desc;const source=document.querySelector('#source-link');source.href=s.sourceUrl;source.textContent=s.sourceLabel;const missingSource=document.querySelector('#source-missing');missingSource.hidden=Boolean(s.sourceUrl);source.hidden=!s.sourceUrl;document.querySelector('#detail-tags').innerHTML=s.tags.map(t=>`<span>${t}</span>`).join('');document.querySelector('#episode-total').textContent=episodeCountLabel(s.episodeCount);const buy=document.querySelector('#detail-buy');buy.textContent=unlocked?(hasStartedWatching(index)?'Продолжить просмотр':'Начать просмотр'):`Купить доступ · ${s.price} ₽`;buy.disabled=false;buy.onclick=()=>unlocked?openEpisodeFeed(index,episodeProgress(index)||1):openPayment(index);
document.querySelector('#episode-list').innerHTML=Array.from({length:s.episodeCount},(_,i)=>{const n=i+1;return `<article class="episode-tile"><button class="episode-cover ${s.scene}" data-play-episode="${n}" aria-label="${unlocked?'Смотреть':'Купить доступ к'} серии ${n}"><span>СЕРИЯ ${String(n).padStart(2,'0')}</span>${unlocked?'':'<b class="tile-lock" aria-label="Доступ закрыт">🔒</b>'}</button><div class="episode-tile-foot"><button class="episode-preview" data-episode-trailer="${n}">Смотреть отрывок</button>${unlocked?`<button class="episode-watch" data-play-episode="${n}">Смотреть</button>`:``}</div></article>`}).join('');document.querySelector('#detail-trailer').onclick=()=>openTrailer(index);document.querySelectorAll('[data-episode-trailer]').forEach(b=>b.onclick=()=>openTrailer(index,Number(b.dataset.episodeTrailer)));document.querySelectorAll('[data-play-episode]').forEach(b=>b.onclick=()=>hasAccess(index)?openEpisodeFeed(index,Number(b.dataset.playEpisode)):openPayment(index));setPane('detail-pane')}

function openAuthor(author){const rows=shows.filter(s=>s.author===author);document.querySelector('#author-title').textContent=`Сериалы автора ${author}`;document.querySelector('#author-grid').innerHTML=rows.map(s=>{const index=shows.indexOf(s);return `<article class="series-card"><button class="cover ${s.scene} art-${s.artIndex}" data-open-series="${index}" aria-label="Открыть сериал ${s.title}"></button><div class="series-info"><div class="by">Автор: ${s.author}</div><button class="series-title" data-open-series="${index}">${s.title}</button><p>${s.desc}</p><div class="tags">${s.tags.map(t=>`<span>${t}</span>`).join('')}</div><div class="series-foot"><button class="btn-trailer" data-open-trailer="${index}">Трейлер</button><button class="btn-series" data-open-series="${index}">Смотреть сериал</button></div></div></article>`}).join('');document.querySelectorAll('#author-grid [data-open-series]').forEach(b=>b.onclick=()=>openSeries(Number(b.dataset.openSeries)));document.querySelectorAll('#author-grid [data-open-trailer]').forEach(b=>b.onclick=()=>openTrailer(Number(b.dataset.openTrailer)));setPane('author-pane')}
function openEpisodeFeed(index,selectedEpisode=1){if(!hasAccess(index)){openPayment(index);return}const s=shows[index],feed=document.querySelector('#episode-feed');if(!s)return;currentSeriesIndex=index;markStartedWatching(index);feed.innerHTML=Array.from({length:s.episodeCount},(_,i)=>{const n=i+1,src=s.videoUrls?.[n]||'';return `<article class="episode-reel-item" id="episode-reel-${n}"><div class="episode-reel-frame">${src?`<video class="episode-reel-video" controls playsinline preload="metadata" src="${src}"></video>`:`<div class="episode-reel-poster scene ${s.scene} art-${s.artIndex} reel-art-${s.artIndex}"><div class="episode-reel-caption"><span>${s.title}</span><strong>· Серия ${n}</strong></div></div>`}</div></article>`}).join('');feed.onscroll=()=>{const current=Math.max(1,Math.min(s.episodeCount,Math.round(feed.scrollTop/Math.max(1,feed.clientHeight))+1));saveEpisodeProgress(index,current)};setPane('episode-feed-pane');requestAnimationFrame(()=>{feed.scrollTop=(Math.max(1,Math.min(s.episodeCount,selectedEpisode))-1)*feed.clientHeight;saveEpisodeProgress(index,selectedEpisode)})}
function showMedia(index,{episode=null,fullEpisode=false}={}){const s=shows[index];if(!s)return;currentSeriesIndex=index;document.querySelector('#trailer-poster').className=`trailer-poster ${s.scene} art-${s.artIndex}`;document.querySelector('#trailer-kind').textContent=fullEpisode?`Серия ${episode}`:episode?'Отрывок':'Трейлер';document.querySelector('#trailer-title').textContent=s.title;document.querySelector('#trailer-description').textContent=fullEpisode?`Серия ${episode} · полный просмотр`:episode?'Короткий отрывок из выбранной серии.':'Трейлер сериала целиком.';const video=document.querySelector('#trailer-video'),poster=document.querySelector('#trailer-poster'),play=document.querySelector('.trailer-play'),placeholder=document.querySelector('.trailer-placeholder');const src=fullEpisode?(s.videoUrls?.[episode]||''):episode?(s.episodeTrailerUrls?.[episode]||''):s.trailerUrl;video.pause();video.removeAttribute('src');video.load();video.style.objectFit=fullEpisode?'contain':'cover';play.hidden=fullEpisode;placeholder.textContent=fullEpisode?'Полная серия ещё не загружена автором.':episode?'Отрывок появится здесь':'Трейлер появится здесь';if(src){video.src=src;video.hidden=false;poster.hidden=true;video.play().catch(()=>{})}else{video.hidden=true;poster.hidden=false}setPane('trailer-pane')}
function openTrailer(index,episode=null){openSeries(index);showMedia(index,{episode})}
function openEpisode(index,episode){if(!hasAccess(index)){openPayment(index);return}markStartedWatching(index);saveEpisodeProgress(index,episode);showMedia(index,{episode,fullEpisode:true})}
document.querySelectorAll('[data-back-catalog]').forEach(b=>b.onclick=()=>setPane('series-pane'));document.querySelectorAll('[data-back-series]').forEach(b=>b.onclick=()=>openSeries(currentSeriesIndex));document.querySelector('#episode-feed-back').onclick=()=>openSeries(currentSeriesIndex);
tagsHTML('#feed-tags');tagsHTML('#series-tags');syncTagControls();render();window.addEventListener('resize',()=>{tagsHTML('#feed-tags');tagsHTML('#series-tags');syncTagControls()});
updateDemoAccessSwitch();document.querySelector('#demo-access-switch').onclick=()=>{demoAccessEnabled=!demoAccessEnabled;localStorage.setItem('dramione-demo-access',demoAccessEnabled?'yes':'no');updateDemoAccessSwitch();render();if(document.querySelector('#detail-pane').classList.contains('active'))openSeries(currentSeriesIndex);toast(demoAccessEnabled?'Демо-доступ включён':'Демо-доступ выключен')};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setPane(b.dataset.mode==='feed'?'feed-pane':'series-pane'));document.querySelector('#mobile-search-toggle').onclick=()=>{const panel=document.querySelector('#mobile-search-panel');panel.hidden=!panel.hidden;if(!panel.hidden)document.querySelector('#search-mobile').focus()};document.querySelector('#payment-close').onclick=closePayment;document.querySelector('#payment-modal').onclick=e=>{if(e.target.id==='payment-modal')closePayment()};document.querySelector('#confirm-purchase').onclick=()=>{saveAccess(currentSeriesIndex);closePayment();render();openSeries(currentSeriesIndex);toast('Доступ открыт — демо-покупка')};
for(const input of [document.querySelector('#search'),document.querySelector('#search-mobile')])input.addEventListener('input',()=>{query=input.value;document.querySelectorAll('input[type=search]').forEach(i=>{if(i!==input)i.value=query});render()});
document.addEventListener('click',e=>{if(!e.target.closest('.more-wrap'))document.querySelectorAll('.tag-popover').forEach(p=>p.hidden=true);if(!e.target.closest('.clip-tag-more-wrap'))document.querySelectorAll('.clip-tag-popover').forEach(p=>{p.hidden=true;p.previousElementSibling?.setAttribute('aria-expanded','false')});document.querySelectorAll('.more-button').forEach(b=>b.setAttribute('aria-expanded',String(!b.nextElementSibling.hidden)));if(!e.target.closest('#mobile-search-panel')&&!e.target.closest('#mobile-search-toggle'))document.querySelector('#mobile-search-panel').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePayment();document.querySelector('#mobile-search-panel').hidden=true;document.querySelectorAll('.tag-popover').forEach(p=>p.hidden=true)}});
</script>
</body>
